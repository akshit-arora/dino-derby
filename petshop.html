<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5e35b1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Room">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Ashwik's Pet Shop</title>
<style>
html,body{margin:0;height:100%;background:#2b1b12;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;width:100vw;height:100vh;height:100dvh;object-fit:contain;background:#000;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.home{position:fixed;top:max(8px,env(safe-area-inset-top));right:8px;width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font:bold 26px/48px sans-serif;text-align:center;text-decoration:none;z-index:10;touch-action:auto}
.turn{display:none;position:fixed;inset:0;z-index:20;background:#5e35b1;color:#fff;font:bold 28px/1.3 "Trebuchet MS",Verdana,sans-serif;text-align:center;align-items:center;justify-content:center;flex-direction:column;padding:24px}
.turn i{font-style:normal;font-size:72px;display:block;margin-bottom:12px}
@media (orientation:portrait) and (max-width:700px){.turn{display:flex}}
</style></head><body>
<a class="home" href="index.html" aria-label="Home">&#8962;</a>
<canvas id="c" width="960" height="600"></canvas>
<div class="turn"><div><i>&#128260;</i>Turn your device sideways to play!</div></div>
<script src="petshop-content.js"></script>
<script src="petshop.js"></script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body></html>
